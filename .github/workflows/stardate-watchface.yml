name: Build watch faces

on:
  push:
    branches: [master]
    paths:
      - "projects/watchfaces/**"
      - ".github/workflows/stardate-watchface.yml"
  pull_request:
    paths:
      - "projects/watchfaces/**"
      - ".github/workflows/stardate-watchface.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        face: [stardate-ops, warp-drive]
    defaults:
      run:
        working-directory: projects/watchfaces/${{ matrix.face }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check generated XML is up to date
        if: hashFiles(format('projects/watchfaces/{0}/tools/generate.py', matrix.face)) != ''
        run: |
          python3 tools/generate.py
          git diff --exit-code -- app/src/main/res/raw/watchface.xml

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME is preset), and
      # AGP downloads any missing platform/build-tools itself.
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.face }}-watchface-apk
          path: projects/watchfaces/${{ matrix.face }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
