name: Galaxy OPS APK

on:
  push:
    paths:
      - 'projects/lcars-galaxy/**'
      - '.github/workflows/lcars-galaxy-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galaxy-ops-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: use your own release key (repo secrets) instead of the
      # committed sideload key. See projects/lcars-galaxy/README.md.
      - name: Load release keystore (optional)
        env:
          KS_B64: ${{ secrets.GOPS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.GOPS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOPS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GOPS_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "GOPS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "GOPS_KEYSTORE_PASSWORD=$KS_PASS"
              echo "GOPS_KEY_ALIAS=$KEY_ALIAS"
              echo "GOPS_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "Using committed sideload keystore."
          fi

      - name: Build APK
        working-directory: projects/lcars-galaxy/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name APK
        id: apk
        run: |
          out="GalaxyOPS-1.0.${{ github.run_number }}.apk"
          cp projects/lcars-galaxy/android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "### Galaxy OPS APK built: \`$out\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyOPS-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      # A Release gives a direct download link you can open on the phone.
      # Builds from master are full releases; other branches are pre-releases.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: galaxy-ops-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Galaxy OPS 1.0.${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          make_latest: ${{ github.ref == 'refs/heads/master' }}
          files: ${{ steps.apk.outputs.file }}
          body: |
            LCARS-style launcher for Samsung Galaxy phones.
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install:** open this page on your phone, tap the `.apk` below, and allow installs from your browser when asked.
