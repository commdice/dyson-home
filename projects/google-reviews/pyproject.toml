[project]
name = "reviewbot"
version = "0.1.0"
description = "Policy-compliant Google review automation: request, monitor, and reply to reviews."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
reviewbot = "reviewbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
